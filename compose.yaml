services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_HOST: 0.0.0.0
      RELAY_BEHIND_TLS_PROXY: '1'
      RELAY_DATA_DIR: /app/data
    ports:
      - '8677:8677/udp'
    volumes:
      - relay_data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set the public relay DNS name}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
volumes:
  relay_data:
  caddy_data:
  caddy_config:
